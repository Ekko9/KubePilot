{{- if not .Values.database.password }}
{{- fail "database.password is required (use values-private.yaml)" }}
{{- end }}
{{- if not .Values.security.secretKey }}
{{- fail "security.secretKey is required (use values-private.yaml)" }}
{{- end }}
{{- if not .Values.security.encryptionKey }}
{{- fail "security.encryptionKey is required (use values-private.yaml)" }}
{{- end }}
{{- if not .Values.security.adminPassword }}
{{- fail "security.adminPassword is required (use values-private.yaml)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-platform.fullname" . }}
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.database.password | quote }}
  secret-key: {{ .Values.security.secretKey | quote }}
  encryption-key: {{ .Values.security.encryptionKey | quote }}
  admin-password: {{ .Values.security.adminPassword | quote }}

